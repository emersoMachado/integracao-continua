name: "Construção do artefato"

on:
  push:
    branches: [ "main", "github_integracao_continua"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker build --target=production -t emersoMachado/projeto-go:${{ github.sha }} .
